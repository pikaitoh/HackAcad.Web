<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="256" viewBox="0 0 1080 256" role="img" aria-labelledby="title desc"><title id="title">Recognise substitution ciphers and their limits</title><desc id="desc">Shift: Replace letters with a fixed rotation; Reverse: Apply the inverse rotation; Evaluate: Small key space limits security</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4d7971"/></marker></defs><rect width="1080" height="256" rx="18" fill="#f2f8f5"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243f47">Recognise substitution ciphers and their limits</text><rect x="32" y="74" width="312" height="142" rx="12" fill="white" stroke="#b9d0c8"/><circle cx="60" cy="105" r="15" fill="#4d7971"/><text x="60" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white">1</text><text x="86" y="111" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243f47">Shift</text><text x="54" y="151" font-family="Arial,sans-serif" font-size="17" fill="#48636b">Replace letters with a fixed</text><text x="54" y="175" font-family="Arial,sans-serif" font-size="17" fill="#48636b">rotation</text><path d="M348 145H370" stroke="#4d7971" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="74" width="312" height="142" rx="12" fill="white" stroke="#b9d0c8"/><circle cx="404" cy="105" r="15" fill="#4d7971"/><text x="404" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white">2</text><text x="430" y="111" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243f47">Reverse</text><text x="398" y="151" font-family="Arial,sans-serif" font-size="17" fill="#48636b">Apply the inverse rotation</text><path d="M692 145H714" stroke="#4d7971" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="74" width="312" height="142" rx="12